name: Flutter checks

on:
  push:
    branches: [main, 'modernization/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android platform project
        run: flutter create --platforms=android --project-name cricket_premier_league --org com.satya1221 .
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: cricket-premier-league-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
